[project]
name = "petromcp"
version = "0.3.0"
description = "MCP server that exposes petroleum data formats to Claude. v0.2 ships LAS; DLIS, SEG-Y, and pump cards next."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amey Ambade" }]
dependencies = [
    "fastmcp>=2.0,<3",
    "lasio>=0.31,<0.32",
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
petromcp = "petromcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petromcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "src"]
