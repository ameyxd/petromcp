[project]
# Distribution name only. The import package, the console script, and the
# MCP server name hosts display are all still `petromcp`. PyPI rejects
# `petromcp` as too similar to the unrelated `petro-mcp`, which normalizes
# to the same string once separators are collapsed.
name = "petroleum-mcp"
version = "0.6.0"
description = "Local-first MCP server for petroleum data. Reads LAS well logs; DLIS, SEG-Y, and pump cards next."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amey Ambade" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "petroleum",
    "well-log",
    "las",
    "petrophysics",
    "oil-and-gas",
    "subsurface",
    "lasio",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0,<3",
    "lasio>=0.31,<0.32",
    # Pinned, not floated: dlisio is a C++ extension and a version bump can
    # change parse behaviour. The weekly float job catches upstream drift.
    "dlisio>=1.0.4,<1.1",
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ameyxd/petromcp"
Repository = "https://github.com/ameyxd/petromcp"
Issues = "https://github.com/ameyxd/petromcp/issues"
Changelog = "https://github.com/ameyxd/petromcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ameyxd/petromcp/blob/main/docs/TOOLS_REFERENCE.md"

[project.scripts]
petromcp = "petromcp.cli:main"
# `uvx <package>` runs the executable whose name matches the package. Because
# the distribution is `petroleum-mcp` and the script is `petromcp`, without
# this alias `uvx petroleum-mcp serve` fails with "executable not found" —
# which is the command every install instruction gives. Both names are kept:
# `petromcp` for people with it on PATH, `petroleum-mcp` so uvx works.
petroleum-mcp = "petromcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petromcp"]

# The sdist carries what someone needs to build, test, and understand the
# package. It deliberately omits `docs/superpowers/` (internal design and
# planning records, ~170KB) and `CLAUDE.md` (agent instructions) — both stay
# in the repo, neither belongs in a distribution.
[tool.hatch.build.targets.sdist]
include = [
    "src/petromcp",
    "tests",
    "examples",
    "evals",
    "docs/*.md",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "SPEC_petromcp.md",
    "Makefile",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
    # Test-data generation only. petromcp itself never writes DLIS.
    "dliswriter>=1.2,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "src"]
