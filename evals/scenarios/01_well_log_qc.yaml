id: "01_well_log_qc"
name: "Well log QC"
kind: "single_well_qc"
description: >
  Build the reference well and verify petromcp surfaces every defect the
  generator recorded: a density null gap, a washout, and a gamma ray spike.
  Expectations are not listed here on purpose — they are read from the
  ground-truth manifest the generator writes beside the LAS, so this scenario
  cannot go stale when the generator changes.
input:
  well: "SYNTH-01"

# The defect kinds this scenario exists to exercise. Asserted against the
# generator's manifest, so removing one from the generator fails the eval
# instead of silently dropping coverage.
expect_defect_kinds:
  - null_gap
  - washout
  - spike
