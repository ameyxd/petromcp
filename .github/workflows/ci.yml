name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject's requires-python; 3.12 is
        # what the lint and type configs target. Test both so the declared
        # floor is a tested claim rather than an aspiration.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest
      - run: uv run python -m evals.run_eval --all
      - run: uv run python -m examples.walkthroughs.build --check

  # Lint and types target one version (3.12) — running them per-matrix-entry
  # would report the same findings twice.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright
      # Catches version drift and broken install commands long before a tag.
      - run: uv run python -m scripts.check_release
