name: release

# Tags carry no `v` prefix in this project; `scripts/check_release.py` fails a
# v-prefixed tag rather than normalising it.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and build, but do not publish"
        type: boolean
        default: true

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # Everything that can fail without side effects runs first. Nothing is
  # published until this passes, because an unpublish is not available on PyPI.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync

      - name: Resolve the version being released
        id: version
        run: |
          version="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      # The tag must match the declared version exactly. Skipped on manual
      # runs, which have no tag.
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python -m scripts.check_release --tag "${GITHUB_REF#refs/tags/}"

      - name: Release consistency checks
        run: uv run python -m scripts.check_release

      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m evals.run_eval --all
      - run: uv run python -m examples.walkthroughs.build --check

      - name: Changelog has a section for this version
        run: uv run python -m scripts.release_notes "${{ steps.version.outputs.version }}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv build
      - run: uv run python -m packaging.mcpb.build || uv run python packaging/mcpb/build.py

      - name: Confirm the wheel provides the console script uvx needs
        run: |
          uv run python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          z = zipfile.ZipFile(wheel)
          name = next(n for n in z.namelist() if n.endswith("entry_points.txt"))
          text = z.read(name).decode()
          print(text)
          assert "petroleum-mcp =" in text, (
              "wheel has no console script matching the distribution name; "
              "`uvx petroleum-mcp` would fail after a successful install"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token and PyPI
      # verifies it. No API token is stored in this repository, and none has to
      # be handed to anyone.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Drop the bundle before uploading
        # PyPI rejects unknown file types, and the .mcpb belongs to the GitHub
        # release rather than the package index.
        run: rm -f dist/*.mcpb
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The check that would have caught two broken releases: run the command the
  # documentation actually gives, against the real index, after publishing.
  verify-published:
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # Poll the PEP 503 simple index, because that is what a resolver reads.
      # An earlier version polled /pypi/<name>/<version>/json, which goes live
      # minutes earlier — so the gate passed and `uvx` then failed to resolve
      # the version that had supposedly landed.
      - name: Wait for the simple index to list the new version
        run: |
          version="${{ needs.verify.outputs.version }}"
          for attempt in $(seq 1 40); do
            if curl -sf "https://pypi.org/simple/petroleum-mcp/" \
                 -H 'Accept: application/vnd.pypi.simple.v1+json' \
               | python3 -c "import sys,json; sys.exit(0 if '$version' in json.load(sys.stdin)['versions'] else 1)"; then
              echo "simple index lists $version"
              exit 0
            fi
            echo "attempt $attempt: simple index does not list $version yet"
            sleep 15
          done
          echo "::error::$version never reached the simple index"
          exit 1
      - name: The documented command must work
        run: uv run python -m scripts.check_release --verify-published

  # Runs only after PyPI is confirmed serving the new version. The bundle pins
  # `uvx petroleum-mcp@<version>`, so publishing it earlier would put a listing
  # in front of users whose install cannot resolve.
  #
  # Without this the Smithery listing drifts silently: it sat two releases
  # behind, advertising six tools for a server that had nine, and nothing
  # failed.
  publish-smithery:
    needs: [verify, build, verify-published]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Job-scoped, so the `if:` on the verification step can see it. A step-level
    # `env:` is not visible to that step's own `if:` expression.
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the bundle
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::warning::SMITHERY_API_KEY is not set; the Smithery listing will"
            echo "::warning::stay on the previous release. Add the secret to automate it."
            exit 0
          fi
          bundle="$(ls dist/*.mcpb)"
          echo "publishing $bundle"
          npx -y @smithery/cli@latest mcp publish "$bundle" -n ameyxd/petromcp

      # Publishing "succeeding" is not the same as the listing being right; it
      # was wrong for two releases while every job stayed green.
      - name: Confirm the listing matches what was just published
        if: env.SMITHERY_API_KEY != ''
        run: |
          expected="$(python3 -c "import json,zipfile,glob; print(len(json.loads(zipfile.ZipFile(glob.glob('dist/*.mcpb')[0]).read('manifest.json'))['tools']))")"
          sleep 15
          actual="$(curl -sf https://api.smithery.ai/servers/ameyxd/petromcp | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("tools") or []))')"
          echo "bundle declares $expected tools; listing reports $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Smithery listing shows $actual tools, expected $expected"
            exit 1
          fi

  # The official MCP registry is metadata-only: it stores server.json and points
  # at PyPI, so it must run after the package is confirmed live or it advertises
  # an install that cannot resolve.
  #
  # Authenticates by GitHub OIDC, which proves ownership of the
  # `io.github.ameyxd/*` namespace. No stored secret, same model as PyPI.
  publish-registry:
    needs: [verify, build, verify-published]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the publisher
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Validate before publishing
        # Catches schema violations without side effects. It caught a
        # description over the 100-character limit the first time it ran.
        run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: [verify, build, verify-published, publish-smithery]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: uv run python -m scripts.release_notes "${{ needs.verify.outputs.version }}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes-file notes.md \
            dist/*.mcpb dist/*.whl dist/*.tar.gz
