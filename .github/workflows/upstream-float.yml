name: upstream-float

# The dependency pins exist so a bad upstream release cannot break a petromcp
# release. The cost of pinning is finding out late, so this runs the suite
# against the *latest* versions weekly and opens an issue when they diverge.
#
# It never changes the pins. Its only job is to turn "petromcp broke for users
# after they upgraded something" into "we knew a week ago".
on:
  schedule:
    # Mondays, 06:00 UTC. Early enough in the week to act on.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  float:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # A virtualenv, not `--system`. The runner's Python is Debian-packaged and
      # externally managed (PEP 668), so `uv pip install --system` fails outright
      # — which is how the first scheduled run died at install, skipped every
      # later step, and reported a red badge with no explanation of what broke.
      - name: Build an environment with every pin relaxed
        id: install
        continue-on-error: true
        run: |
          uv venv
          # Named without constraints on purpose: this is what a user gets on a
          # fresh install once these versions are the current ones.
          uv pip install \
            fastmcp lasio dlisio pydantic numpy pyyaml \
            pytest dliswriter
          uv pip install --no-deps -e .
          {
            echo "versions<<EOF"
            uv pip list | grep -iE "^(fastmcp|lasio|dlisio|pydantic|numpy|dliswriter) " || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Suite against unpinned upstreams
        id: suite
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv/bin/python -m pytest -q

      - name: Evals against unpinned upstreams
        id: evals
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: .venv/bin/python -m evals.run_eval --all

      - name: Decide whether anything is wrong
        id: verdict
        run: |
          # Install failing counts. The first run failed there and opened
          # nothing, because the issue step only considered the suite and the
          # evals — both of which had been skipped, not failed.
          failed=false
          reasons=""
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            failed=true
            reasons="${reasons}- could not install the unpinned dependency set at all\n"
          else
            [ "${{ steps.suite.outcome }}" != "success" ] && { failed=true; reasons="${reasons}- test suite failed\n"; }
            [ "${{ steps.evals.outcome }}" != "success" ] && { failed=true; reasons="${reasons}- eval scenarios failed\n"; }
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          printf "reasons<<EOF\n%b\nEOF\n" "$reasons" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.verdict.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream float: petromcp fails against latest dependencies"
          # One open issue, updated weekly, rather than a new one every Monday.
          existing="$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')"
          body="$(cat <<EOF
          The weekly unpinned run failed. petromcp's own pins still hold, so
          released versions are unaffected — but a user installing fresh once
          these versions are common will hit this.

          What went wrong:

          ${{ steps.verdict.outputs.reasons }}

          Step outcomes: install \`${{ steps.install.outcome }}\`, suite
          \`${{ steps.suite.outcome }}\`, evals \`${{ steps.evals.outcome }}\`.

          Versions under test:

          \`\`\`
          ${{ steps.install.outputs.versions }}
          \`\`\`

          [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label dependencies 2>/dev/null || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Close the tracking issue once upstream is clean again
        if: steps.verdict.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Otherwise a fixed problem leaves an open issue nobody trusts.
          existing="$(gh issue list --state open \
            --search "Upstream float: petromcp fails against latest dependencies in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Unpinned run is green again as of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Closing."
            gh issue close "$existing"
          fi

      - name: Fail the run so the badge reflects reality
        if: steps.verdict.outputs.failed == 'true'
        run: exit 1
